name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Per branch, so a pull request run cannot cancel a deploy from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Entur client name: the ENTUR_CLIENT_NAME repository variable if set,
      # otherwise "<owner>-ruter-timetable". Forks get their own name this way.
      - name: Set Entur client name
        env:
          CLIENT_NAME: ${{ vars.ENTUR_CLIENT_NAME || format('{0}-ruter-timetable', github.repository_owner) }}
        run: echo "VITE_ENTUR_CLIENT_NAME=$(echo "$CLIENT_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          # The path GitHub Pages serves from. Set the BASE_PATH variable to "/" for a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only the deploy job, which never runs pull request code, can publish to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
